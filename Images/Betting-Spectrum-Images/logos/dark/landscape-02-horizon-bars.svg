  <path d="M76 201h105" stroke="#f4f4f5" stroke-width="12" stroke-linecap="round"/>
  <circle cx="77" cy="201" r="9" fill="#ef4444"/>
  <circle cx="128" cy="201" r="9" fill="#22c55e"/>
  <circle cx="181" cy="201" r="9" fill="#6366f1"/>
  </g>
  <text x="344" y="176" fill="#f4f4f5" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="72" font-weight="800" letter-spacing="0">The Edge Spectrum</text>
  <text x="350" y="232" fill="#a1a1aa" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="28" font-weight="500" letter-spacing="0">Expected returns across activities and time horizons</text>
</svg>
