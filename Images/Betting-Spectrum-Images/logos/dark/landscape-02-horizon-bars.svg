<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">The Edge Spectrum Horizon Bars landscape logo concept</title>
  <desc id="desc">Time-horizon return bars crossing a baseline Landscape logo proposal for GitHub README art and website headers.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="360" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#18181b"/>
      <stop offset="1" stop-color="#050505"/>
    </linearGradient>
    <linearGradient id="accent" x1="78" y1="70" x2="286" y2="282" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#6366f1"/>
      <stop offset="1" stop-color="#22c55e"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="360" rx="40" fill="url(#bg)"/>
  <rect x="72" y="72" width="216" height="216" rx="46" fill="#09090b" stroke="url(#accent)" stroke-width="8"/>
  <g transform="translate(72 72) scale(0.84375)">
  <rect x="62" y="91" width="31" height="74" rx="12" fill="#ef4444"/>
  <rect x="106" y="69" width="31" height="118" rx="12" fill="#22c55e"/>
  <rect x="150" y="105" width="31" height="55" rx="12" fill="#6366f1"/>
