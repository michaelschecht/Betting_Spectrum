<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" role="img" aria-labelledby="title desc">
  <title id="title">The Edge Spectrum Edge Gradient favicon concept</title>
  <desc id="desc">A positive-to-negative edge axis with a central break-even point Square favicon proposal for The Edge Spectrum.</desc>
  <defs>
    <linearGradient id="bg" x1="28" y1="24" x2="228" y2="232" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#18181b"/>
      <stop offset="1" stop-color="#050505"/>
    </linearGradient>
    <linearGradient id="accent" x1="32" y1="30" x2="224" y2="226" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#8b5cf6"/>
    </linearGradient>
    <filter id="glow" x="-28%" y="-28%" width="156%" height="156%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="256" height="256" rx="54" fill="url(#bg)"/>
  <rect x="20" y="20" width="216" height="216" rx="42" fill="none" stroke="url(#accent)" stroke-width="8"/>
  <g filter="url(#glow)">
  <path d="M58 128h140" stroke="#27272a" stroke-width="13" stroke-linecap="round"/>
  <path d="M74 92c28 38 57 38 86 0M74 164c28-38 57-38 86 0" fill="none" stroke="#38bdf8" stroke-width="12" stroke-linecap="round"/>
  <circle cx="70" cy="128" r="15" fill="#22c55e"/>
  <circle cx="128" cy="128" r="20" fill="#f4f4f5"/>
  <circle cx="186" cy="128" r="15" fill="#8b5cf6"/>
  <path d="M128 86v84" stroke="#8b5cf6" stroke-width="10" stroke-linecap="round"/>
  </g>
</svg>
