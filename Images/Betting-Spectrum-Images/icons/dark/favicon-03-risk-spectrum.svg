<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" role="img" aria-labelledby="title desc">
  <title id="title">The Edge Spectrum Risk Spectrum favicon concept</title>
  <desc id="desc">A curved return path over a risk spectrum divider Square favicon proposal for The Edge Spectrum.</desc>
  <defs>
    <linearGradient id="bg" x1="28" y1="24" x2="228" y2="232" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#18181b"/>
      <stop offset="1" stop-color="#050505"/>
    </linearGradient>
    <linearGradient id="accent" x1="32" y1="30" x2="224" y2="226" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#22c55e"/>
